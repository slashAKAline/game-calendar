name: Update Game Calendars

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update calendars
        run: |
          python generate_calendar.py

      - name: Commit changes
        run: |
          git config user.name "game-calendar-bot"
          git config user.email "game-calendar-bot@users.noreply.github.com"
          git add *.ics
          git diff --cached --quiet || git commit -m "Update game calendars"
          git push
